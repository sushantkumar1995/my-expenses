<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Expenses"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>My Expenses</title></head><body>
<main><header><div><small>PERSONAL FINANCE</small><h1>My Expenses</h1></div><button id="backup">Backup</button></header>
<nav><button id="prev">‹</button><b id="month"></b><button id="next">›</button></nav>
<section class="hero"><small>AVAILABLE THIS MONTH</small><h2 id="available">₹0</h2><div class="stats"><div>Income<b id="income">₹0</b></div><div>Spent<b id="spent">₹0</b></div></div></section>
<section class="card"><div class="between"><b>Monthly budget</b><button id="budgetBtn">Set</button></div><h3 id="budget">Not set</h3><div class="bar"><i id="bar"></i></div><small id="budgetStatus">Set a budget to track spending.</small></section>
<h3>Spending by category</h3><div id="cats"></div><div class="between"><h3>Transactions</h3><input id="search" placeholder="Search"></div><div id="txs"></div></main>
<button class="fab" id="add">+</button>
<dialog id="dlg"><form id="form"><div class="between"><h2 id="formTitle">Add transaction</h2><button type="button" id="close">×</button></div><div class="seg"><button type="button" data-type="expense">Expense</button><button type="button" data-type="income">Income</button></div><label>Amount<input id="amount" type="number" inputmode="decimal" min="0" step=".01" required></label><label>Category<select id="category"></select></label><label>Note<input id="note" maxlength="80"></label><label>Date<input id="date" type="date" required></label><button class="save">Save transaction</button><button type="button" class="delete" id="delete">Delete</button></form></dialog>
<dialog id="backupDlg"><div class="between"><h2>Backup</h2><button id="backupClose">×</button></div><button class="save" id="export">Export backup</button><label class="import">Import backup<input id="import" type="file" accept="application/json"></label><p>Your financial data is stored locally on this device. Export a backup periodically.</p></dialog>
<script src="app.js"></script></body></html>
